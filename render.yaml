services:
  - type: web
    name: busgp
    env: node
    region: singapore
    buildCommand: npm run build --prefix frontend && npm run build --prefix backend && mkdir -p backend/public && cp -r frontend/dist/* backend/public/
    startCommand: npm start --prefix backend
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
