<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer Circular Seal Badge -->
  <circle cx="50" cy="50" r="48" fill="#047857" stroke="#d97706" stroke-width="3" />
  <circle cx="50" cy="50" r="44" fill="#065f46" stroke="#fbbf24" stroke-width="1.5" />

  <!-- Top Tamil Nadu Gopuram Emblem Silhouette -->
  <g transform="translate(0, -4)">
    <path d="M40 42 L42 22 L58 22 L60 42 Z" fill="#fbbf24" stroke="#ffffff" stroke-width="0.5" />
    <path d="M42 32 L44 17 L56 17 L58 32 Z" fill="#f59e0b" />
    <rect x="47" y="26" width="6" height="8" fill="#065f46" rx="2" />
    <!-- Finials -->
    <circle cx="46" cy="13" r="1.5" fill="#fbbf24" />
    <circle cx="50" cy="11" r="2" fill="#fbbf24" />
    <circle cx="54" cy="13" r="1.5" fill="#fbbf24" />
  </g>

  <!-- Government Bus Silhouette -->
  <g transform="translate(0, 5)">
    <!-- Bus Body Frame -->
    <rect x="22" y="42" width="56" height="38" rx="5" fill="#1e3a8a" stroke="#fbbf24" stroke-width="1.5" />

    <!-- Windshield -->
    <rect x="26" y="48" width="48" height="15" rx="2" fill="#0284c7" stroke="#ffffff" stroke-width="1" />
    <path d="M28 49 L38 49 L30 61 L28 61 Z" fill="#ffffff" opacity="0.4" />

    <!-- Grill & Headlights -->
    <rect x="25" y="65" width="50" height="10" rx="2" fill="#1e293b" />
    <circle cx="31" cy="70" r="3" fill="#fef08a" stroke="#ffffff" stroke-width="0.8" />
    <circle cx="69" cy="70" r="3" fill="#fef08a" stroke="#ffffff" stroke-width="0.8" />
    <rect x="40" y="68" width="20" height="4" rx="1" fill="#fbbf24" />
  </g>

  <!-- Tricolor Accent Ring -->
  <path d="M24 88 Q50 94 76 88" fill="none" stroke="#fbbf24" stroke-width="1.5" />
  <rect x="36" y="88" width="28" height="1.5" fill="#f97316" />
  <rect x="36" y="89.5" width="28" height="1.5" fill="#ffffff" />
  <rect x="36" y="91" width="28" height="1.5" fill="#16a34a" />
</svg>
